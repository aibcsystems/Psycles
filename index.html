<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Still — an ambient window to time.">
  <title>Still — Atmosphere Engine</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <canvas id="scene" aria-label="Still ambient atmosphere"></canvas>

  <div id="hint" aria-hidden="true">move to reveal studio</div>

  <div id="readout" aria-live="polite">
    <div class="time" id="readout-time">—</div>
    <div class="meta" id="readout-meta">—</div>
  </div>

  <section id="controls" aria-label="Still Studio controls">
    <div class="brand">STILL <span>STUDIO</span></div>

    <div class="field">
      <label for="exhibition">Exhibition</label>
      <select id="exhibition">
        <option value="horizon">Horizon No. 01</option>
        <option value="forest">Forest No. 01</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="field time-field">
      <label for="time-slider">Time <span id="time-value">08:00</span></label>
      <input id="time-slider" type="range" min="0" max="24" step="0.01" value="8">
    </div>

    <div class="field">
      <label for="weather">Weather</label>
      <select id="weather">
        <option value="clear">Clear</option>
        <option value="rain">Rain</option>
        <option value="fog">Fog</option>
        <option value="snow">Snow</option>
      </select>
    </div>

    <div class="field">
      <label for="season">Season</label>
      <select id="season">
        <option value="spring">Spring</option>
        <option value="summer" selected>Summer</option>
        <option value="autumn">Autumn</option>
        <option value="winter">Winter</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="live">Live</option>
        <option value="manual" selected>Studio</option>
      </select>
    </div>
  </section>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
